    content="Find your perfect smartphone at IMobile Service Center. New, used phones, accessories, and parts." />
  <!-- Content Security Policy: Allow unsafe-eval in development for Vite HMR -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; script-src * 'unsafe-inline' 'unsafe-eval' data: blob:; style-src * 'unsafe-inline' data: blob:; img-src * data: blob: https:; connect-src * 'unsafe-inline' 'unsafe-eval' data: blob: wss:; frame-src *; font-src * data:;" />
  <title>IMobile Service Center - Your Perfect Smartphone</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/imobile-logo.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="/imobile-logo.png" />

  <!-- Google Fonts - Geist and Geist Mono -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap"
    rel="stylesheet">
</head>

<body style="margin: 0; padding: 0;">
  <div id="root"></div>

  <!--
    Last-resort recovery for a poisoned entry bundle.

    If a browser ever cached the SPA fallback HTML *as* /assets/index-<hash>.js, the
    module script below fails before a single line of app code runs - so the router,
    the ErrorBoundary and any in-app chunk recovery never execute and the user just
    sees a white page. This has to live here, as a classic (non-module) script, to be
    running before that happens.

    Re-fetching with cache:'reload' bypasses and *overwrites* the poisoned HTTP cache
    entry, after which a reload boots normally. Guarded by sessionStorage so a genuine
    outage cannot turn into a reload loop.
  -->
  <script>
    (function () {
      var KEY = '__entry_recovery__';
      window.addEventListener('error', function (e) {
        var el = e.target;
        if (!el || el.tagName !== 'SCRIPT' || el.type !== 'module' || !el.src) return;
        if (sessionStorage.getItem(KEY)) return;
        sessionStorage.setItem(KEY, '1');
        fetch(el.src, { cache: 'reload' })
          .catch(function () { })
          .then(function () { location.reload(); });
      }, true); // capture: resource load errors do not bubble
      window.addEventListener('load', function () {
        var r = document.getElementById('root');
        if (r && r.childNodes.length) sessionStorage.removeItem(KEY);
      });
    })();
  </script>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
