<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description"
    content="Find your perfect smartphone at IMobile Service Center. New, used phones, accessories, and parts." />
  <!-- Content Security Policy: Allow unsafe-eval in development for Vite HMR -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; script-src * 'unsafe-inline' 'unsafe-eval' data: blob:; style-src * 'unsafe-inline' data: blob:; img-src * data: blob: https:; connect-src * 'unsafe-inline' 'unsafe-eval' data: blob: wss:; frame-src *; font-src * data:;" />
  <title>IMobile Service Center - Your Perfect Smartphone</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/imobile-logo.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="/imobile-logo.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/imobile-logo.png" />
  <!-- Google Fonts - Geist and Geist Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap"
    rel="stylesheet">
</head>

<body style="margin: 0; padding: 0;">
  <div id="root"></div>

  <!--
    Last-resort recovery when the entry bundle does not load.

    The module script at the bottom of this file fails before a single line of app
    code runs, so the router, the ErrorBoundary and the in-app chunk recovery in
    src/lib/chunk-recovery.ts never execute and the user just sees a white page.
    This has to live here, as a classic (non-module) script, to be running before
    that happens.

    There are TWO distinct faults, and they need opposite fixes:

      POISONED - the file exists, but a cache is holding the SPA fallback HTML
                 under its URL. Re-fetching past the caches repairs the entry and
                 the page boots without a reload. Reloading alone fixes nothing:
                 the fresh HTML names the same URL and gets the same bad bytes.

      GONE     - the file has been deleted, because a deploy renamed every asset
                 (see BUILD_ID in vite.config.ts) and this document is from the
                 previous build. No amount of re-fetching that URL will help; the
                 only fix is to load the CURRENT document, which names the current
                 assets. This is what an open tab hits after every deploy.

    Telling them apart is one fetch: a 404 (or HTML) means GONE, so we reload the
    document with a cache-busting query - `location.reload()` is not enough,
    because it is allowed to re-serve the very document that named the dead asset.

    Bounded by a sessionStorage attempt counter, not a boolean: a boolean latches
    after the first try and leaves a genuinely stale tab white forever, which is
    exactly how this was reported.
  -->
  <script>
    (function () {
      var KEY = '__entry_recovery__';
      var MAX_ATTEMPTS = 2;
      var WINDOW_MS = 60000;
      var PARAM = 'imobile_build';

      // A poisoned copy usually sits in the CDN edge cache, not just this browser,
      // so cache:'reload' alone still gets served the same bad bytes. A unique query
      // string is a different edge cache key, which is what actually reaches origin.
      var bust = function (url) {
        return url + (url.indexOf('?') < 0 ? '?' : '&') + 'cb=' + Date.now();
      };

      var readState = function () {
        try {
          var s = JSON.parse(sessionStorage.getItem(KEY) || 'null');
          if (s && typeof s.n === 'number' && typeof s.t === 'number' && Date.now() - s.t < WINDOW_MS) return s;
        } catch (err) { /* malformed: start a fresh window */ }
        return { n: 0, t: Date.now() };
      };

      // Returns false once the budget is spent, so a real outage shows the plain
      // browser error instead of reloading forever.
      var claimAttempt = function () {
        var s = readState();
        if (s.n >= MAX_ATTEMPTS) return false;
        try { sessionStorage.setItem(KEY, JSON.stringify({ n: s.n + 1, t: s.t })); } catch (err) { }
        return true;
      };

      var reloadDocument = function () {
        var url = location.pathname + (location.search
          ? location.search + '&' : '?') + PARAM + '=' + Date.now();
        location.replace(url + location.hash);
      };

      window.addEventListener('error', function (e) {
        var el = e.target;
        if (!el || el.tagName !== 'SCRIPT' || el.type !== 'module' || !el.src) return;
        if (!claimAttempt()) return;

        var src = el.src;

        // Is the file missing, or just poisoned? Ask, then pick the right fix.
        fetch(bust(src), { cache: 'reload' })
          .then(function (res) {
            var type = res.headers.get('content-type') || '';
            if (!res.ok || type.indexOf('html') > -1) return null; // GONE
            return res.text();
          })
          .then(function (code) {
            if (code === null) { reloadDocument(); return; }

            // POISONED: the bare URL is the one the browser will use, so overwrite
            // that cache entry too before re-running the module.
            fetch(src, { cache: 'reload' }).catch(function () { }).then(function () {
              var s = document.createElement('script');
              s.type = 'module';
              s.src = bust(src);
              s.onerror = reloadDocument;
              document.head.appendChild(s);
            });
          })
          .catch(reloadDocument);
      }, true); // capture: resource load errors do not bubble

      window.addEventListener('load', function () {
        // A stylesheet refused for its MIME type fires NO error event (verified in
        // Chrome), and link.sheet is still set - only it parses to zero rules. So the
        // parsed result is the signal. Inlining the refetched CSS restores styling
        // immediately; a reload would just hit the same poisoned URL again.
        var links = document.querySelectorAll('link[rel="stylesheet"]');
        for (var i = 0; i < links.length; i++) {
          var link = links[i];
          // Build output only. Cross-origin sheets (fonts) throw on cssRules access.
          if (!link.href || link.href.indexOf(location.origin + '/assets/') !== 0) continue;
          var rules = -1;
          try { rules = link.sheet ? link.sheet.cssRules.length : 0; } catch (err) { rules = -1; }
          if (rules !== 0) continue;
          (function (href) {
            fetch(bust(href), { cache: 'reload' })
              .then(function (res) { return res.ok ? res.text() : ''; })
              .then(function (css) {
                if (!css || css.charAt(0) === '<') return; // missing, or still the fallback page
                var style = document.createElement('style');
                style.setAttribute('data-recovered-from', href);
                style.textContent = css;
                document.head.appendChild(style);
              })
              .catch(function () { });
          })(link.href);
        }

        // The app mounted, so whatever went wrong is over: clear the budget and
        // take the cache-busting parameter back out of the address bar.
        var r = document.getElementById('root');
        if (r && r.childNodes.length) {
          try { sessionStorage.removeItem(KEY); } catch (err) { }
          if (location.search.indexOf(PARAM + '=') > -1 && window.history && history.replaceState) {
            try {
              var url = new URL(location.href);
              url.searchParams.delete(PARAM);
              history.replaceState(history.state, document.title, url.pathname + url.search + url.hash);
            } catch (err) { }
          }
        }
      });
    })();
  </script>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
