<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Not found - IMobile Service Center</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #fafafa;
      font-family: Geist, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
      padding: 24px;
    }
    .code { font-size: 14px; letter-spacing: .18em; text-transform: uppercase; color: #a1a1aa; }
    h1 { font-size: 28px; font-weight: 600; margin: 12px 0 8px; }
    p { color: #a1a1aa; margin: 0 0 24px; line-height: 1.6; }
    a {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 8px;
      background: #fafafa;
      color: #0a0a0a;
      font-weight: 500;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <!--
    This file exists to make Cloudflare Pages return REAL 404s.

    Without a 404.html, Pages answers every unmatched path with index.html at
    HTTP 200 + text/html - including /assets/*.js and /assets/*.css. Browsers and
    the CDN then cache that HTML *as* the module or stylesheet, and the site dies
    with "Failed to load module script: ... MIME type of text/html" until the
    entry expires hours later. That is the outage this file prevents.

    The SPA rewrites for real client routes live in public/_redirects, which Pages
    evaluates BEFORE this fallback - so deep links still serve the app. Any new
    route added to src/App.tsx must be added there too, or it will land here.

    Verify both halves after deploying with: npm run check:deploy
  -->
  <div>
    <div class="code">Error 404</div>
    <h1>Page not found</h1>
    <p>The page you are looking for does not exist or has been moved.</p>
    <a href="/">Back to home</a>
  </div>
</body>

</html>
